<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Company Registration | Personalized Startup Internship Recommendation System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header"><div class="header-inner">
        <h1>Personalized Startup Internship Recommendation System</h1>
        <p>Create a company account to connect with students.</p>
    </div>    </header>
    <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
    </nav>
    <main class="page-content">
        <h2>Company Registration</h2>
        <div class="status-message status-error" id="company-register-error" role="alert" hidden></div>
        <p class="page-intro">Register your company account. You can manage company details and internships after sign in.</p>
        <form class="form-card" action="startupRegister" method="post" onsubmit="return validateCompanyRegistration()">
            <fieldset>
                <legend>Company Account Details</legend>
                <div class="form-grid">
                    <div class="field field-full">
                        <label for="company-name">Company name</label>
                        <input id="company-name" type="text" name="company_name" required maxlength="150" autocomplete="organization">
                    </div>
                    <div class="field field-full">
                        <label for="company-id">Company ID</label>
                        <input id="company-id" type="text" name="company_id" required maxlength="50" autocomplete="username">
                    </div>
                    <div class="field field-full">
                        <label for="company-email">Email address</label>
                        <input id="company-email" type="email" name="email" required autocomplete="email">
                    </div>
                    <div class="field">
                        <label for="company-password">Password</label>
                        <input id="company-password" type="password" name="password" required minlength="6" autocomplete="new-password">
                    </div>
                    <div class="field">
                        <label for="confirm-password">Confirm password</label>
                        <input id="confirm-password" type="password" name="confirm_password" required minlength="6" autocomplete="new-password">
                    </div>
                </div>
            </fieldset>
            <div class="form-actions">
                <input type="submit" value="Create Company Account">
                <a href="company-login.html">Already registered? Company Login</a>
            </div>
        </form>
    </main>
    <script>
        function validateCompanyRegistration() {
            var password = document.getElementById("company-password").value;
            var confirmPassword = document.getElementById("confirm-password").value;
            if (password !== confirmPassword) {
                var errorMessage = document.getElementById("company-register-error");
                errorMessage.textContent = "The passwords do not match.";
                errorMessage.hidden = false;
                return false;
            }
            return true;
        }
        var registrationError = new URLSearchParams(window.location.search).get("error");
        if (registrationError) {
            var errorMessage = document.getElementById("company-register-error");
            errorMessage.textContent = registrationError === "exists"
                ? "That company ID is already registered. Please sign in or use a different ID."
                : "Please check all required company details and password confirmation.";
            errorMessage.hidden = false;
        }
    </script>
</body>
</html>
