<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Login</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        function checkLogin() {
            var username = document.forms["loginForm"]["t1"].value.trim();
            var password = document.forms["loginForm"]["t2"].value;

            if (username === "") {
                alert("Enter your username.");
                return false;
            }
            if (password.trim() === "") {
                alert("Enter your password.");
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
    <header class="site-header"><div class="header-inner">
        <h1>Personalized Startup Internship Recommendation System</h1>
        <p>Student sign in</p>
    </div>    </header>
    <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
    </nav>
    <main class="page-content">
        <h2>Student Login</h2>
        <div class="status-message" id="login-message" role="status" hidden></div>
        <p class="page-intro">Enter your account details to access your profile.</p>
        <form class="form-card" name="loginForm" action="login" method="post" onsubmit="return checkLogin()">
            <fieldset>
                <legend>Student Account</legend>
                <div class="form-grid">
                    <div class="field field-full">
                        <label for="username">Username</label>
                        <input id="username" type="text" name="t1" autocomplete="username" required>
                    </div>
                    <div class="field field-full">
                        <label for="password">Password</label>
                        <input id="password" type="password" name="t2" autocomplete="current-password" required>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit">Sign In</button>
                    <a class="button button-secondary" href="register.html">Create Account</a>
                </div>
                <p class="field-hint">Project demonstration authentication uses the configured database and is not intended for production security.</p>
            </fieldset>
        </form>
    </main>
    <script>
        var loginStatus = new URLSearchParams(window.location.search).get("registered");
        var loginError = new URLSearchParams(window.location.search).get("login");
        if (loginStatus === "success" || loginError === "error") {
            var message = document.getElementById("login-message");
            message.textContent = loginStatus === "success"
                ? "Your student account was created. Sign in to continue."
                : "The username or password was not accepted. Please try again.";
            message.hidden = false;
        }
    </script>
</body>
</html>
