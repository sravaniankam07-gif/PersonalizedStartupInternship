<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Feedback | Personalized Startup Internship Recommendation System</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        function updateFeedbackCount() {
            document.getElementById("feedback-count").textContent = document.getElementById("feedback").value.length;
        }

        function validateFeedback() {
            let feedback = document.getElementById("feedback").value.trim();
            if (feedback.length < 10) {
                alert("Please enter at least 10 characters of feedback.");
                return false;
            }
            if (feedback.length > 1000) {
                alert("Feedback must be 1000 characters or less.");
                return false;
            }
            alert("Thanks for your feedback. This project demo does not save feedback yet.");
            return false;
        }
    </script>
</head>
<body>
    <header class="site-header"><div class="header-inner">
        <h1>Personalized Startup Internship Recommendation System</h1>
        <p>Your feedback helps us improve the experience.</p>
    </div></header>
    <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="feedback.html" aria-current="page">Feedback</a>
    </nav>
    <main class="page-content">
        <h2>Feedback</h2>
        <p class="page-intro">Tell us what is working well or how we can make the system better.</p>
        <form class="form-card" name="feedbackForm" onsubmit="return validateFeedback()">
            <fieldset>
                <legend>Your Feedback</legend>
                <div class="field">
                    <label for="feedback">Comments</label>
                    <textarea id="feedback" name="feedback" rows="8" minlength="10" maxlength="1000" required oninput="updateFeedbackCount()"></textarea>
                    <span class="field-hint">Please enter 10 to 1000 characters. <span id="feedback-count" aria-live="polite">0</span>/1000</span>
                </div>
                <div class="form-actions">
                    <input type="submit" value="Submit Feedback">
                    <input type="reset" value="Clear">
                </div>
            </fieldset>
        </form>
    </main>
</body>
</html>
